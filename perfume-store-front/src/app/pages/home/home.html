<!-- Navigation Bar -->
<header class="navbar-header">
  <div class="navbar-container">
    <!-- Desktop Navigation Links -->
    <nav class="desktop-nav">
      <ul class="nav-links">
        <li>
          <a routerLink="/home" routerLinkActive="active" class="nav-link">
            Home
          </a>
        </li>
        <li>
          <a routerLink="/product" routerLinkActive="active" class="nav-link">
            Products
          </a>
        </li>
      </ul>
    </nav>

    <!-- Mobile Hamburger Button -->
    <button class="mobile-toggle-btn" (click)="toggleMobileMenu()" [attr.aria-expanded]="isMobileMenuOpen()"
      aria-label="Toggle navigation menu">
      @if (isMobileMenuOpen()) {
      <!-- Close Icon -->
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
      } @else {
      <!-- Hamburger Icon -->
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
      }
    </button>
  </div>

  <!-- Mobile Dropdown Navigation -->
  @if (isMobileMenuOpen()) {
  <nav class="mobile-nav">
    <ul class="mobile-nav-links">
      <li>
        <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
          class="mobile-nav-link" (click)="closeMobileMenu()">
          Home
        </a>
      </li>
      <li>
        <a routerLink="/product" routerLinkActive="active" class="mobile-nav-link" (click)="closeMobileMenu()">
          Products
        </a>
      </li>
    </ul>
  </nav>
  }
</header>
